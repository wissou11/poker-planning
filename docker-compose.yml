services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./PokerPlanningBack
      dockerfile: dockerfile
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/pokerplanning
      BEZKODER_APP_JWTSECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./PokerPlanningFront
      dockerfile: dockerfile
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongo-data:
