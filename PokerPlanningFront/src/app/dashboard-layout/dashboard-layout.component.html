<aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 fixed-start bg-gradient-dark" id="sidenav-main" style="z-index: 800;">
  <div class="sidenav-header">
    <i class="fas fa-times p-3 cursor-pointer text-white opacity-5 position-absolute end-0 top-0 d-none d-xl-none" aria-hidden="true" id="iconSidenav"></i>
    <div class="navbar-brand m-0" target="_blank">
      <img src="../../assets/img/logo-ct.png" class="navbar-brand-img h-100" alt="main_logo">
      <span class="ms-1 font-weight-bold text-white">Poker Planning</span>
    </div>
  </div>
  <hr class="horizontal light mt-0 mb-2">
  <div class="collapse navbar-collapse  w-auto " id="sidenav-collapse-main">
    <ul class="navbar-nav">
      <li class="nav-item" *ngIf="userRole === 'PRODUCTOWNER'">
        <a class="nav-link text-white" routerLink="/dashboard/projects" routerLinkActive="active bg-gradient-primary" [routerLinkActiveOptions]="{ exact: true }">
          <div class="text-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="material-icons opacity-10">table_view</i>
          </div>
          <span class="nav-link-text ms-1">Projects</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="userRole === 'PRODUCTOWNER'">
        <a class="nav-link text-white" routerLink="/dashboard/productowner-dashboard" routerLinkActive="active bg-gradient-primary">
          <div class="text-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="material-icons opacity-10">receipt_long</i>
          </div>
          <span class="nav-link-text ms-1">Developers</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="userRole === 'DEVELOPPER'">
        <a class="nav-link text-white" routerLink="/dashboard/estimations" routerLinkActive="active bg-gradient-primary">
          <div class="text-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="material-icons opacity-10">receipt_long</i>
          </div>
          <span class="nav-link-text ms-1">Estimations</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="userRole === 'DEVELOPPER'">
        <a class="nav-link text-white" routerLink="/dashboard/developer/projects" routerLinkActive="active bg-gradient-primary">
          <div class="text-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="material-icons opacity-10">receipt_long</i>
          </div>
          <span class="nav-link-text ms-1">Developer Projects</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/dashboard/reddit" routerLinkActive="active bg-gradient-primary">
          <div class="text-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="material-icons opacity-10">book</i>
          </div>
          <span class="nav-link-text ms-1">Reddit Posts</span>
        </a>
      </li>
    </ul>
  </div>
  <div class="sidenav-footer position-absolute w-100 bottom-0">
    <div class="mx-3">
      <a class="btn btn-outline-primary mt-4 w-100" (click)="logout()">Logout</a>
    </div>
  </div>
</aside>
<main class="main-content position-relative max-height-vh-100 h-100" id="main-section">
  <nav class="navbar navbar-main navbar-expand-xl px-4 h-20 shadow-gray-sm bg-white" id="navbarBlur" data-scroll="true">
    <nav aria-label="breadcrumb">
      <h6 class="font-weight-bolder mb-0">Poker Planning</h6>
    </nav>
    <div>
      <a class="nav-link text-body p-0" id="iconNavbarSidenav">
        <div class="sidenav-toggler-inner">
          <i class="sidenav-toggler-line"></i>
          <i class="sidenav-toggler-line"></i>
          <i class="sidenav-toggler-line"></i>
        </div>
      </a>
    </div>
  </nav>
  <div class="container-fluid py-4 px-5">
    <router-outlet></router-outlet>
  </div>
</main>
