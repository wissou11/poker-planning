<div class="bg-secondary d-flex align-items-center justify-content-between border-radius-lg" id="action-bar">
  <h6 class="text-white text-capitalize">View Task</h6>
  <div id="action-btn">
    <a class="btn btn-primary" [routerLink]="['/dashboard/projects/view/', projectId, 'tasks','view', taskId, 'comments']">Comments</a>
    <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#importprojectsmodal">Start a vote</a>
  </div>
</div>

<div *ngIf="taskId" class="card bg-white my-4 p-4" id="table-body-card">
  <div class="card-body px-0 pb-2 border-radius-lg">
    <div class="row">
      <div class="col-12 col-xl-8">
        <div class="card card-plain h-100">
          <div class="card-header pb-0 p-3">
            <div class="row">
              <div class="col-md-8 d-flex align-items-center">
                <h6 class="mb-0">Title: {{ task?.title }}</h6>
              </div>
              <div class="col-md-4 text-end">
                <a href="javascript:;">
                  <i class="fas fa-user-edit text-secondary text-sm" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit Profile"></i>
                </a>
              </div>
            </div>
          </div>
          <div class="card-body p-3">
            <p class="text-sm"> <strong>Description: </strong> {{ task?.description }}</p>
            <hr class="horizontal gray-light my-4">
            <ul class="list-group">
              <li class="list-group-item border-0 ps-0 text-sm">
                <strong class="text-dark">Status:</strong> &nbsp; {{ task?.status }}
              </li>
              <li class="list-group-item border-0 ps-0 pb-0">
                <strong class="text-dark text-sm">Votes:</strong> &nbsp;
              </li>
            </ul>
          </div>
        </div>
      </div>
      <div class="col-12 col-xl-4"></div>
    </div>
    <div *ngIf="estimations.length > 0" class="table-responsive p-3 w-100">
      <table class="table align-items-center mb-3" style="border: 1px solid #ddd;">
        <thead>
          <tr>
            <th class="text-uppercase text-secondary text-xs font-weight-bolder opacity-7 align-middle text-center" scope="col">
              Deadline
            </th>
            <th class="text-uppercase text-secondary text-xs font-weight-bolder opacity-7 align-middle text-center" scope="col">
              Average Score
            </th>
            <th class="text-uppercase text-secondary text-xs font-weight-bolder opacity-7 align-middle text-center" scope="col">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let estimation of estimations">
            <td class="align-middle text-center">{{ estimation.deadline }}</td>
            <td class="align-middle text-center">{{ estimation.averageScore }}</td>
            <td class="align-middle text-center">
              <a (click)="viewEstimation(estimation.id)" class="btn btn-link text-info text-gradient px-2 mb-0 ml-1">
                <i class="material-icons text-sm me-2">visibility</i>
                View
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="importprojectsmodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <form>
          <label for="interval">Choose an interval (min)</label>
          <div class="input-group">
            <div class="input-group input-group-outline mb-3">
              <input id="interval" type="number" class="form-control" placeholder="Choose an interval" [disabled]="isVoting" required>
            </div>
          </div>
        </form>
        <div id="timer" class="px-1">
          {{ timeRemaining$ | async | date:'mm:ss' }}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" [disabled]="isVoting">Close</button>
        <button type="button" class="btn btn-primary" (click)="startVote()" [disabled]="isVoting">Start</button>
      </div>
    </div>
  </div>
</div>
