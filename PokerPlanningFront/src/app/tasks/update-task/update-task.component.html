<!-- update-project.component.html -->
<h4 class="mx-4" >Update Task</h4>
<form class="card px-4 py-4" [formGroup]="taskForm" (ngSubmit)="submit()">
  <label for="taskTitle">Task Title</label>
  <div class="input-group input-group-outline mb-3">
    <input id="taskTitle" type="text" class="form-control" formControlName="title" placeholder="Enter task title" required>
    <div *ngIf="taskForm.get('title')?.invalid && (taskForm.get('title')?.dirty || taskForm.get('title')?.touched)">
      <div *ngIf="taskForm.get('title')?.errors?.['required']" class="text-danger">Title is required.</div>
      <div *ngIf="taskForm.get('title')?.errors?.['minlength']" class="text-danger">Title must be at least 3 characters long.</div>
      <div *ngIf="taskForm.get('title')?.errors?.['maxlength']" class="text-danger">Title must be less than 20 characters.</div>
    </div>
  </div>
  <label for="taskDescription">Task Description</label>
  <div class="input-group input-group-outline mb-3">
    <input id="taskDescription" type="text" class="form-control" formControlName="description" placeholder="Enter task description" required>
    <div *ngIf="taskForm.get('description')?.invalid && (taskForm.get('description')?.dirty || taskForm.get('description')?.touched)">
      <div *ngIf="taskForm.get('description')?.errors?.['required']" class="text-danger">Description is required.</div>
      <div *ngIf="taskForm.get('description')?.errors?.['minlength']" class="text-danger">Description must be at least 3 characters long.</div>
      <div *ngIf="taskForm.get('description')?.errors?.['maxlength']" class="text-danger">Description must be less than 20 characters.</div>
    </div>
  </div>

  <label for="Duree">Choose a Number</label>
  <div class="input-group input-group-outline mb-3">
    <select id="Duree" formControlName="duree" class="form-control" required>
      <option value="" disabled>Select duree</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="8">8</option>
      <option value="13">13</option>
    </select>
    <div *ngIf="taskForm.get('duree')?.invalid && (taskForm.get('duree')?.dirty || taskForm.get('duree')?.touched)" class="text-danger">
      <div *ngIf="taskForm.get('duree')?.errors?.['required']" class="text-danger">Duree is required.</div>
    </div>
  </div>


  <label for="status">Status</label>
  <div class="input-group input-group-outline mb-3">
    <select id="status" formControlName="status" class="form-control" required>
      <option value="" disabled>Select status</option>
      <option value="Planned">Planned</option>
      <option value="In Progress">In Progress</option>
      <option value="Done">Done</option>
    </select>
    <div *ngIf="taskForm.get('status')?.invalid && (taskForm.get('status')?.dirty || taskForm.get('status')?.touched)" class="text-danger">
      <div *ngIf="taskForm.get('status')?.errors?.['required']" class="text-danger">Status is required.</div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
