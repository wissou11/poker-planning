<div class="bg-secondary d-flex align-items-center justify-content-between border-radius-lg" id="action-bar">
  <h6 class="text-white text-capitalize">View Estimation</h6>
  <div id="action-btn"></div>
</div>
<div class="row">
  <div class="col-12">
      <div class="card bg-white my-4 p-4" id="table-body-card">
          <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
          </div>
          <div class="card-body px-0 pb-2 border-radius-lg">
            <div class="row">
              <div class="col-12 col-xl-8">
                <div class="card card-plain h-100">
                  <div class="card-header pb-0 p-3">
                    <div class="row">
                      <div class="col-md-8 d-flex align-items-center">
                        <h6 class="mb-0">  Final Score  </h6>
                      </div>
                      <div class="col-md-4 text-end">
                        <a href="javascript:;">
                          <i class="fas fa-user-edit text-secondary text-sm" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit Profile"></i>
                        </a>
                      </div>
                    </div>
                  </div>
                  <div class="card-body p-3">
                    <p class="text-sm">
                      <span class="final-score" > {{estimation?.averageScore}} </span>
                    </p>
                    <hr class="horizontal gray-light my-4">
                    <ul class="list-group">
                      <li class="list-group-item border-0 ps-0 pb-0">
                        <strong class="text-dark text-sm">Scores :</strong> &nbsp;
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="col-12 col-xl-4">
              </div>
            </div>
            <div class="table-responsive p-3 w-100">
              <table class="table align-items-center mb-3" style="border: 1px solid #ddd;">
                <thead>
                  <tr>
                    <th class="text-uppercase text-secondary text-xs font-weight-bolder opacity-7 align-middle text-center" scope="col">
                      Developer
                    </th>
                    <th class="text-uppercase text-secondary text-xs font-weight-bolder opacity-7 align-middle text-center" scope="col">
                      Score
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let score of estimation?.scores">
                    <td class="align-middle text-center">{{ score?.user?.userName }}</td>
                    <td class="align-middle text-center">{{ score?.scoreValue }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
      </div>
  </div>
</div>
