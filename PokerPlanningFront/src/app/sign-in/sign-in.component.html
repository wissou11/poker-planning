<main class="main-content mt-0">
  <div class="page-header align-items-start min-vh-100" style="background-image: url('/assets/img/office-dark.jpg');">
    <span class="mask bg-gradient-dark opacity-6"></span>
    <div class="container my-auto">
      <div class="row">
        <div class="col-lg-4 col-md-8 col-12 mx-auto">
          <div class="card z-index-0 fadeIn3 fadeInBottom">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-primary shadow-primary border-radius-lg py-3 pe-1">
                <h4 class="text-white font-weight-bolder text-center mt-2 mb-0">Sign in</h4>
              </div>
            </div>
            <div class="card-body">
              <form role="form" class="text-start" (ngSubmit)="onSubmit()">
                <div class="input-group input-group-outline my-3">
                  <input type="text" class="form-control" [(ngModel)]="username" name="username" required placeholder="Username">
                </div>
                <div class="input-group input-group-outline mb-3">
                  <div class="input-group-append d-flex" style="width: 100%;">
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" required placeholder="Password" style="border-right: none; border-radius: 0;">
                    <button type="button" (click)="togglePasswordVisibility()" class="btn btn-outline-secondary btn-eye" style="height: 100%; border-left: none;  border-radius: 0 5px 5px 0; border-color: #CED4DA;">
                      <i class="material-icons eye-icon">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
                    </button>
                  </div>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn bg-gradient-primary w-100 my-4 mb-2">Sign in</button>
                </div>
                <div *ngIf="errorMessage" class="alert alert-danger mt-2">
                  {{ errorMessage }}
                </div>
                <p class="mt-4 text-sm text-center">
                  Don't have an account?
                  <a routerLink="/sign-up" class="text-primary text-gradient font-weight-bold">Sign up</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
