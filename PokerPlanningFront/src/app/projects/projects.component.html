<div class="bg-secondary d-flex align-items-center justify-content-between mb-2 border-radius-lg" id="action-bar">
    <h6 class="text-white text-capitalize">Projects</h6>
    <div id="action-btn">
        <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#importprojectsmodal" data-bs-whatever="@mdo">Import</a>

        <a class="btn btn-primary" routerLink="/dashboard/projects/create">Create project</a>
    </div>
</div>
<div class="row">
    <div class="col-12">
        <div class="card bg-white my-4" id="table-body-card">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
            </div>
            <div class="card-body px-0 pb-2 border-radius-lg">

                <div class="table-responsive p-0">
                    <table class="table align-items-center mb-0">
                        <thead>
                            <tr>
                                <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Product Owner</th>
                                <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Project <Title></Title></th>
                                <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Status</th>
                                <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Start Date</th>
                                <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let project of projects">
                                <td>
                                    <div class="d-flex px-2 py-1">
                                        <div class="d-flex flex-column justify-content-center">
                                            <h6 class="mb-0 text-sm">{{project.creator}}</h6>
                                            <p class="text-xs text-secondary mb-0">{{project.productOwner}}</p>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <p class="text-xs font-weight-bold mb-0">{{project.nom}}</p>
                                    <p class="text-xs text-secondary mb-0">{{project.description}}</p>
                                </td>
                                <td class="align-middle text-center text-sm">
                                    <span class="badge badge-sm bg-gradient-success">{{project.status}}</span>
                                </td>
                                <td class="align-middle text-center">
                                    <span class="text-secondary text-xs font-weight-bold">{{project.startdate}}</span>
                                </td>
                                <td class="align-middle text-center">
                                    <a [routerLink]="['/dashboard/projects/update', project.id]" class="btn btn-outline-primary btn-sm mb-0 me-3" data-toggle="tooltip" data-original-title="Edit project">
                                        Edit
                                    </a>
                                    <a [routerLink]="['/dashboard/projects/view', project.id]" class="btn btn-outline-primary btn-sm mb-0 me-3" data-toggle="tooltip" data-original-title="View project">
                                        view
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="" id="pagination-bar">
    <nav aria-label="Page navigation example">
        <ul class="pagination">
          <li class="page-item">
            <a class="page-link" href="#" aria-label="Previous">
              <span aria-hidden="true">&laquo;</span>
            </a>
          </li>
          <li class="page-item"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item">
            <a class="page-link" href="#" aria-label="Next">
              <span aria-hidden="true">&raquo;</span>
            </a>
          </li>
        </ul>
    </nav>
</div>

<div class="modal fade" id="importprojectsmodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Import projects</h5>
        </div>
        <div class="modal-body">
          <form>
            <div class="input-group mb-3">
                <label class="input-group-text" for="projects-file">Upload</label>
                <input type="file" class="form-control" id="projects-file">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Import</button>
        </div>
      </div>
    </div>
</div>
